<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Charts</title>
<style>
  :root {
    --bg: #131722; --panel: #1e222d; --border: #2a2e39; --text: #d1d4dc; --muted: #787b86;
    --accent: #2962ff; --up: #26a69a; --down: #ef5350;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }

  header { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  input, select { background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 6px 10px; font-size: 13px; }
  input { text-transform: uppercase; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  #ticker { width: 140px; font-size: 14px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 4px;
    padding: 7px 12px; font-size: 13px; cursor: pointer; }
  .tool { background: var(--panel); color: var(--text); border: 1px solid var(--border); padding: 5px 10px; }
  .tool:hover { border-color: var(--accent); }
  .tool.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }
  label.auto { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  #status { color: var(--muted); margin-left: auto; }
  #status.error { color: var(--down); }

  .layout { flex: 1; display: grid; grid-template-columns: 240px 1fr; min-height: 0; }

  /* ---- sidebar */
  aside { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
    margin: 0; padding: 10px 12px 6px; display: flex; justify-content: space-between; align-items: center; }
  .add { padding: 0 12px 8px; }
  .add input { width: 100%; }
  #watchlist { overflow-y: auto; flex: 1.4; min-height: 0; }
  .wl-row { display: grid; grid-template-columns: 1fr auto auto; gap: 2px 8px; padding: 6px 12px;
    cursor: pointer; border-left: 3px solid transparent; align-items: center; }
  .wl-row:hover { background: var(--panel); }
  .wl-row.active { background: var(--panel); border-left-color: var(--accent); }
  .wl-sym { font-weight: 600; }
  .wl-price { text-align: right; font-variant-numeric: tabular-nums; }
  .wl-chg { text-align: right; font-variant-numeric: tabular-nums; min-width: 58px; }
  .wl-del { grid-row: 1; grid-column: 4; visibility: hidden; color: var(--muted); background: none; padding: 0 2px; }
  .wl-row:hover .wl-del { visibility: visible; }
  .wl-del:hover { color: var(--down); }
  .wl-badges { grid-column: 1 / -1; display: flex; gap: 4px; flex-wrap: wrap; }
  .badge { font-size: 10px; padding: 1px 5px; border-radius: 3px; border: 1px solid currentColor; }
  .badge.up { color: var(--up); } .badge.down { color: var(--down); }
  .wl-err { grid-column: 1 / -1; color: var(--muted); font-size: 11px; }

  #scanner { overflow-y: auto; flex: 1; min-height: 0; border-top: 1px solid var(--border); }
  .sc-row { padding: 5px 12px; display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .sc-row:hover { background: var(--panel); }
  .sc-tf { color: var(--muted); font-size: 11px; width: 52px; }
  .empty { padding: 6px 12px; color: var(--muted); font-size: 12px; }

  /* ---- charts */
  .charts { --split: 50%; display: grid; grid-template-columns: minmax(0, var(--split)) 10px minmax(0, 1fr);
    column-gap: 2px; padding: 4px; min-height: 0; }
  .splitter { cursor: col-resize; position: relative; touch-action: none; user-select: none; -webkit-user-select: none; }
  .splitter::after { content: ''; position: absolute; top: 0; bottom: 0; left: 4px; width: 2px;
    border-radius: 1px; background: var(--border); transition: background .15s; }
  .splitter:hover::after, .splitter.dragging::after { background: var(--accent); }
  body.resizing { cursor: col-resize; user-select: none; -webkit-user-select: none; }
  .legend, .col-title { user-select: none; -webkit-user-select: none; }
  body.resizing .charts { pointer-events: none; }
  body.resizing .splitter { pointer-events: auto; }
  .column { display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .col-title { padding: 4px 8px; font-weight: 600; background: var(--panel); border-bottom: 1px solid var(--border); }
  .pane { position: relative; min-height: 0; border-top: 1px solid var(--border); }
  .pane.main { flex: 5; border-top: 0; }
  .pane.sub { flex: 1.5; }
  body.drawing .pane.main { cursor: crosshair; outline: 1px dashed var(--accent); outline-offset: -1px; }
  .legend { position: absolute; top: 4px; left: 8px; z-index: 3; pointer-events: none;
    font-size: 11px; line-height: 1.5; color: var(--text); }
  .legend span { margin-right: 8px; }

  footer { padding: 3px 12px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--text); }
  #toasts { position: fixed; right: 16px; bottom: 16px; z-index: 50; display: flex; flex-direction: column; gap: 8px; max-width: calc(100vw - 32px); }
  .toast { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--accent);
    border-radius: 4px; padding: 10px 14px; min-width: 240px; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  .toast.up { border-left-color: var(--up); } .toast.down { border-left-color: var(--down); }
  .toast b { display: block; margin-bottom: 2px; }

  @media (max-width: 1000px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: 220px 1fr; overflow-y: auto; }
    aside { border-right: 0; border-bottom: 1px solid var(--border); flex-direction: row; }
    aside > div { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .charts { grid-template-columns: 1fr; grid-auto-rows: 90vh; gap: 4px; }
    .splitter { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>📈 Trading Charts</h1>
  <input id="ticker" placeholder="Ticker (ex: AAPL)" autocomplete="off">
  <button id="go">Carregar</button>
  <div class="sep"></div>
  <button class="tool" data-tool="trend" title="Linha de tendência: clique em 2 pontos">↗ Tendência</button>
  <button class="tool" data-tool="ray" title="Raio: tendência estendida para a direita (2 pontos)">➚ Raio</button>
  <button class="tool" data-tool="hline" title="Linha horizontal (aparece no semanal e no diário)">― Horizontal</button>
  <button class="tool" data-tool="note" title="Anotação de texto em um candle">T Texto</button>
  <button class="tool" id="undo" title="Desfazer último desenho">↶ Desfazer</button>
  <button class="tool" id="clear" title="Apagar todos os desenhos deste ticker">🗑 Limpar</button>
  <div class="sep"></div>
  <label class="auto">Atualizar
    <select id="auto">
      <option value="0">Desligado</option>
      <option value="1">1 min</option>
      <option value="5">5 min</option>
      <option value="15">15 min</option>
    </select>
  </label>
  <button class="tool" id="alerts" title="Notificar quando um ticker da watchlist der sinal no scanner">🔔 Alertas</button>
  <span id="status"></span>
</header>
<div class="layout">
  <aside>
    <div style="display:flex;flex-direction:column;flex:1.4;min-height:0">
      <h2>Watchlist</h2>
      <div class="add"><input id="wl-add" placeholder="+ Adicionar ticker" autocomplete="off"></div>
      <div id="watchlist"></div>
    </div>
    <div style="display:flex;flex-direction:column;flex:1;min-height:0;border-top:1px solid var(--border)">
      <h2>Scanner <span style="text-transform:none;letter-spacing:0">última barra</span></h2>
      <div id="scanner" style="border-top:0"></div>
    </div>
  </aside>
  <div class="charts">
    <section class="column" id="col-weekly"></section>
    <div class="splitter" id="splitter" title="Arraste para redimensionar · duplo clique volta para 50/50"></div>
    <section class="column" id="col-daily"></section>
  </div>
</div>

<footer>Gráficos por <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView Lightweight Charts™</a> · Dados: Yahoo Finance</footer>
<div id="toasts"></div>
<script src="lightweight-charts.js"></script>
<script src="app.js?v=2"></script>
</body>
</html>
